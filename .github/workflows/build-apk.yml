name: Build APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PhoneBridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge
          path: PhoneBridge.apk

      - name: Publish as "latest" release (easy download on the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PhoneBridge.apk \
            --title "Phone Bridge build ${{ github.run_number }}" \
            --notes "Install PhoneBridge.apk on your phone. Built from ${{ github.sha }}."
